name: Build PJSCompressor Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build diagnostic EXE (console)
        run: pyinstaller --noconfirm --clean --onefile --console --name PJSCompressor-Diagnostic main.py
      - name: Build GUI EXE (windowed)
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PJSCompressor main.py
      - name: Upload diagnostic EXE
        uses: actions/upload-artifact@v7
        with:
          name: PJSCompressor-Diagnostic-Windows
          path: dist/PJSCompressor-Diagnostic.exe
      - name: Upload GUI EXE
        uses: actions/upload-artifact@v7
        with:
          name: PJSCompressor-GUI-Windows
          path: dist/PJSCompressor.exe
