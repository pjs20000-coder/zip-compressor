name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Diagnostic EXE (console enabled)
        run: pyinstaller --noconfirm --clean --onefile --console --debug=all --collect-all tkinterdnd2 --name PJSCompressor main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PJSCompressor-Windows-Diagnostic
          path: dist/PJSCompressor.exe
