name: Build PJSCompressor PJS4 Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build GUI EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all tkinterdnd2 --name PJSCompressor-PJS4 main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: PJSCompressor-PJS4-Windows
          path: dist/PJSCompressor-PJS4.exe
          if-no-files-found: error
