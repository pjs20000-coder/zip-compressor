
name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --collect-all tkinterdnd2 --name main main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: main-windows-exe
          path: dist/main.exe

