name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Build diagnostic EXE
        run: pyinstaller --noconfirm --clean --onefile --console --debug=imports --collect-all tkinterdnd2 --name PJSCompressor main.py

      - name: Upload diagnostic EXE
        uses: actions/upload-artifact@v4
        with:
          name: PJSCompressor-Windows-Diagnostic
          path: dist/PJSCompressor.exe
          if-no-files-found: error
